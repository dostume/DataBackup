name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x repo/source/gradlew
      working-directory: repo/source

    - name: Build APK
      run: ./gradlew assembleFossRelease
      working-directory: repo/source

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-foss-release
        path: repo/source/app/build/outputs/apk/foss/release/*.apk