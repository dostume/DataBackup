name: Build APK

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Uses a fixed Gradle version so the build does not depend on
      # gradle-wrapper.jar being present in the working tree.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Prepare signing keystore
        run: |
          STORE_FILE="${{ github.workspace }}/release.keystore"
          echo "STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$STORE_FILE"
            echo "Using secrets-provided keystore (stable signing)."
            echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets found, generating a temporary keystore. This APK cannot be updated over a differently-signed install."
            keytool -genkeypair -v \
              -keystore "$STORE_FILE" \
              -alias "databackup" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "DataBackupCI2024" \
              -keypass "DataBackupCI2024" \
              -dname "CN=DataBackup CI, OU=CI, O=DataBackup, C=US"
            echo "STORE_PASSWORD=DataBackupCI2024" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=databackup" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=DataBackupCI2024" >> "$GITHUB_ENV"
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build arm64 FOSS release APK
        run: gradle assembleArm64-v8aFossRelease --no-daemon --stacktrace
        working-directory: source

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DataBackup-arm64-foss-release
          path: |
            source/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
